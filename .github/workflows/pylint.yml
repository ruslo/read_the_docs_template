name: Pylint

on:
  push:
    branches-ignore:
    - 'wip.*'
    - 'pr.*'
    tags:
    - '*'
  pull_request:
    branches:
    - '*'

jobs:
  build:
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
    runs-on: ubuntu-24.04

    steps:
    # - https://github.com/actions/checkout
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Setup Python virtual environment for linting
      working-directory: doc
      run: uv sync --locked

    - name: Check run_build.py
      working-directory: doc
      run: uv run pylint run_build.py

    - name: Check make_release.py
      working-directory: doc
      run: uv run pylint make_release.py

    - name: Check check_format.py
      working-directory: doc
      run: uv run pylint check_format.py

    - name: Check conf.py
      working-directory: doc
      run: uv run pylint --const-naming-style=snake_case --allow-global-unused-variables=yes conf.py

    - name: Run Ruff
      working-directory: doc
      run: uv run ruff check --show-files .

    - name: Run Sphinx Lint
      working-directory: doc
      run: uv run sphinx-lint --ignore .venv/ .
